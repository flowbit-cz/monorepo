# Claude keeps tests up to date:
#  - on every PR it adds missing tests for the changed code (skill dertour-write-tests) and pushes them to the PR branch
#  - when CI fails on a PR, it diagnoses the failure and pushes a fix (skill dertour-fix-tests)
#  - "@claude ..." in a PR comment runs any request
# Needs the ANTHROPIC_API_KEY secret. Claude only proposes commits on the PR branch. A human reviews and merges.
name: Claude tests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  write-tests:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, ref: "${{ github.head_ref }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile && node tooling/ai/install.mjs
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Use the dertour-write-tests skill for the files changed in this PR (git diff origin/${{ github.base_ref }}...HEAD).
            Add only missing or clearly insufficient tests. Run `pnpm verify`. If you added tests, commit them with
            "test: cover <area>" and push to this branch. Then post a short PR comment: what you covered, and any bug you
            found in the code (don't fix product code here, just report it).
          claude_args: --max-turns 40

  fix-ci:
    if: >
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, ref: "${{ github.event.workflow_run.head_branch }}" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile && node tooling/ai/install.mjs
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            CI run ${{ github.event.workflow_run.html_url }} failed. Use the dertour-fix-tests skill: read the failed
            logs (gh run view ${{ github.event.workflow_run.id }} --log-failed), decide whether the code or the test is
            wrong, fix it with the smallest change and run `pnpm verify`. Commit "fix: <root cause>" and push to this
            branch, then comment on the PR with the root cause. Never skip, delete or weaken a test.
          claude_args: --max-turns 40

  mention:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile && node tooling/ai/install.mjs
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
