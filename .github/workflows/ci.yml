name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # OpenAPI specs of the backends. Without them, the bundled demo spec is used.
  OPENAPI_OFFERS_URL: ${{ vars.OPENAPI_OFFERS_URL }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test:coverage build --affected
        env:
          SKIP_ENV_VALIDATION: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: "**/coverage/coverage-summary.json"
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright, mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # One Playwright version for the whole repo (catalog), so the browser serves every app.
      - run: pnpm --filter @dertour/template exec playwright install --with-deps chromium
      - run: for app in apps/*/; do [ -f "${app}.env.example" ] && cp "${app}.env.example" "${app}.env"; done
      # E2E of every app affected by the change (all apps on main).
      - run: pnpm turbo run test:e2e --affected -- --project=chromium
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/*/playwright-report
